name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          go mod download
          go -C tools mod download
          pnpm install --frozen-lockfile

      - name: Scan reachable Go vulnerabilities
        run: go tool govulncheck ./...

      - name: Audit production dependencies
        shell: bash
        env:
          pnpm_config_registry: https://registry.npmjs.org/
        run: |
          set -Eeuo pipefail

          echo "Audit registry:"
          pnpm config get registry

          pnpm audit \
            --prod \
            --audit-level high

      - name: Install verified Trivy
        run: |
          bash scripts/security/install-trivy.sh \
            "${RUNNER_TEMP}/bin"

          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan repository
        run: |
          trivy fs \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --scanners vuln,misconfig,secret \
            .

  images:
    name: Container security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install verified Trivy
        run: |
          bash scripts/security/install-trivy.sh \
            "${RUNNER_TEMP}/bin"

          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Build representative service image
        run: |
          docker build \
            --file build/package/service.Dockerfile \
            --build-arg SERVICE=api-bff \
            --build-arg VERSION=security-scan \
            --build-arg REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag gereh-security/api-bff:${GITHUB_SHA} \
            .

      - name: Build web image
        run: |
          docker build \
            --file build/package/web.Dockerfile \
            --build-arg VERSION=security-scan \
            --build-arg REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag gereh-security/web:${GITHUB_SHA} \
            .

      - name: Scan service image
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            gereh-security/api-bff:${GITHUB_SHA}

      - name: Scan web image
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            gereh-security/web:${GITHUB_SHA}
