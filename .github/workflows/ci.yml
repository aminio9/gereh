name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Synchronize workspace
        run: go work sync

      - name: Download dependencies
        run: |
          go mod download
          go -C tools mod download

      - name: Verify formatting
        run: |
          files="$(find platform services runtime-connectors gen -type f -name '*.go')"
          test -z "$(gofmt -l ${files})"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build services
        run: bash scripts/build-services.sh

  contracts:
    name: Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Download tool dependencies
        run: go -C tools mod download

      - name: Install generators
        run: go -C tools install tool

      - name: Lint contracts
        run: go tool buf lint

      - name: Check contract formatting
        run: go tool buf format --diff --exit-code

      - name: Generate contracts
        run: |
          rm -rf gen/go
          mkdir -p gen/go
          go tool buf generate
          go mod tidy

      - name: Verify generated files
        run: git diff --exit-code -- gen/go go.mod go.sum

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: "11.4.0"
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
