name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Synchronize workspace
        run: go work sync

      - name: Download dependencies
        run: |
          go mod download
          go -C tools mod download

      - name: Check formatting
        run: |
          files="$(
            find \
              platform \
              services \
              runtime-connectors \
              gen \
              -type f \
              -name '*.go'
          )"

          unformatted="$(gofmt -l ${files})"

          if [[ -n "${unformatted}" ]]; then
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go tool golangci-lint run

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Build services
        run: bash scripts/build-services.sh

  contracts:
    name: Contract validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
          github_token: ${{ github.token }}

      - name: Install Protobuf generators
        shell: bash
        run: |
          set -Eeuo pipefail

          tool_bin="${RUNNER_TEMP}/gereh-go-tools"
          mkdir -p "${tool_bin}"

          GOBIN="${tool_bin}" \
            go -C tools install \
            google.golang.org/protobuf/cmd/protoc-gen-go

          GOBIN="${tool_bin}" \
            go -C tools install \
            google.golang.org/grpc/cmd/protoc-gen-go-grpc

          test -x "${tool_bin}/protoc-gen-go"
          test -x "${tool_bin}/protoc-gen-go-grpc"

          "${tool_bin}/protoc-gen-go" --version
          "${tool_bin}/protoc-gen-go-grpc" --version

          echo "${tool_bin}" >> "${GITHUB_PATH}"

      - name: Verify contract tools
        shell: bash
        run: |
          set -Eeuo pipefail

          buf --version
          command -v protoc-gen-go
          command -v protoc-gen-go-grpc

          protoc-gen-go --version
          protoc-gen-go-grpc --version

      - name: Lint Protobuf contracts
        run: buf lint

      - name: Check Protobuf formatting
        shell: bash
        run: |
          set -Eeuo pipefail

          buf format \
            --diff \
            --exit-code

      - name: Check Protobuf compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail

          buf breaking \
            --against "${{ github.event.repository.clone_url }}#branch=${{ github.event.pull_request.base.ref }}"

      - name: Verify generated contracts
        shell: bash
        run: |
          set -Eeuo pipefail

          bash scripts/contracts/generate.sh

          git diff \
            --exit-code \
            -- gen/go

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint public OpenAPI contract
        run: pnpm exec redocly lint contracts/openapi/public-api.yaml

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  infrastructure:
    name: Development infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create development environment
        run: |
          cp \
            deployments/local/.env.example \
            deployments/local/.env

      - name: Validate Compose model
        run: |
          docker compose \
            --env-file deployments/local/.env \
            -f deployments/local/compose.yaml \
            config --quiet

      - name: Start infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail

          COMPOSE=(
            docker compose
            --env-file deployments/local/.env
            -f deployments/local/compose.yaml
          )

          if ! "${COMPOSE[@]}" up \
            -d \
            --wait \
            --wait-timeout 240 \
            postgres \
            redis \
            kafka \
            temporal
          then
            echo "=== Compose status ==="
            "${COMPOSE[@]}" ps -a || true

            echo "=== PostgreSQL logs ==="
            "${COMPOSE[@]}" logs \
              --no-color \
              --tail=500 \
              postgres || true

            echo "=== PostgreSQL health ==="
            container_id="$("${COMPOSE[@]}" ps -q postgres)"

            if [[ -n "${container_id}" ]]; then
              docker inspect \
                --format '{{json .State.Health}}' \
                "${container_id}" || true
            fi

            exit 1
          fi

          "${COMPOSE[@]}" run --rm kafka-init

      - name: Smoke-test infrastructure
        env:
          POSTGRES_USER: gereh
        run: |
          bash scripts/infra/smoke-test.sh \
            deployments/local/compose.yaml \
            deployments/local/.env

      - name: Test shared Kafka transport
        env:
          KAFKA_BROKERS: localhost:9092
          KAFKA_INTEGRATION_TOPIC: gereh.audit.events.v1
        run: |
          go test \
            -race \
            -tags=integration \
            -count=1 \
            ./platform/go/events/kafka

      - name: Show logs after failure
        if: failure()
        run: |
          docker compose \
            --env-file deployments/local/.env \
            -f deployments/local/compose.yaml \
            ps -a

          docker compose \
            --env-file deployments/local/.env \
            -f deployments/local/compose.yaml \
            logs --no-color --tail=300

      - name: Stop infrastructure
        if: always()
        run: |
          docker compose \
            --env-file deployments/local/.env \
            -f deployments/local/compose.yaml \
            down -v --remove-orphans

  runtimecell-contract:
    name: RuntimeCell Kubernetes contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Synchronize workspace
        run: go work sync

      - name: Download Go dependencies
        run: |
          go mod download
          go -C tools mod download

      - name: Generate RuntimeCell API artifacts
        run: |
          bash scripts/runtimecell/generate.sh

      - name: Verify generated RuntimeCell artifacts
        run: |
          git diff \
            --exit-code \
            -- \
            platform/go/runtimecell/api/v1/zz_generated.deepcopy.go \
            deploy/crds/runtime.gereh.ai_runtimecells.yaml

      - name: Install kind
        shell: bash
        run: |
          set -Eeuo pipefail

          tool_bin="${RUNNER_TEMP}/gereh-kind"
          mkdir -p "${tool_bin}"

          GOBIN="${tool_bin}" \
            go install sigs.k8s.io/kind@v0.32.0

          echo "${tool_bin}" >> "${GITHUB_PATH}"

      - name: Create Kubernetes 1.36 cluster
        run: |
          kind create cluster \
            --name gereh-runtimecell \
            --image \
            kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5 \
            --wait 120s

      - name: Install RuntimeCell CRD
        run: |
          kubectl apply -k deploy/crds
          kubectl wait \
            --for=condition=Established \
            crd/runtimecells.runtime.gereh.ai \
            --timeout=60s

      - name: Validate RuntimeCell API contract
        run: |
          bash scripts/runtimecell/validate-live.sh

      - name: Show cluster diagnostics after failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get crd runtimecells.runtime.gereh.ai -o yaml || true
          kubectl get runtimecells -A -o yaml || true

      - name: Delete kind cluster
        if: always()
        run: |
          kind delete cluster \
            --name gereh-runtimecell

  database-contracts:
    name: Database contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Atlas
        uses: ariga/setup-atlas@v0.3
        with:
          version: "v1.3.0"

      - name: Create migration roles and databases
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -Eeuo pipefail

          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c '
              CREATE ROLE gereh_model_access_app
              NOLOGIN
              NOSUPERUSER
              NOCREATEDB
              NOCREATEROLE
              NOINHERIT
              NOREPLICATION
              NOBYPASSRLS;
            '

          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c '
              CREATE ROLE gereh_model_gateway_app
              NOLOGIN
              NOSUPERUSER
              NOCREATEDB
              NOCREATEROLE
              NOINHERIT
              NOREPLICATION
              NOBYPASSRLS;
            '

          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE model_access_ci;'

          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE model_gateway_ci;'

      - name: Validate Model Access migration directory
        env:
          MODEL_ACCESS_MIGRATION_DATABASE_URL: >-
            postgres://postgres:postgres@127.0.0.1:5432/model_access_ci?sslmode=disable
        run: |
          atlas migrate validate \
            --env model_access

      - name: Apply Model Access migrations
        env:
          MODEL_ACCESS_MIGRATION_DATABASE_URL: >-
            postgres://postgres:postgres@127.0.0.1:5432/model_access_ci?sslmode=disable
        run: |
          atlas migrate apply \
            --env model_access

      - name: Validate Model Gateway migration directory
        env:
          MODEL_GATEWAY_MIGRATION_DATABASE_URL: >-
            postgres://postgres:postgres@127.0.0.1:5432/model_gateway_ci?sslmode=disable
        run: |
          atlas migrate validate \
            --env model_gateway

      - name: Apply Model Gateway migrations
        env:
          MODEL_GATEWAY_MIGRATION_DATABASE_URL: >-
            postgres://postgres:postgres@127.0.0.1:5432/model_gateway_ci?sslmode=disable
        run: |
          atlas migrate apply \
            --env model_gateway

