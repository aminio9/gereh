version: "3"

silent: false

vars:
  COMPOSE: docker compose --project-name gereh-platform-dev -f .devcontainer/compose.yaml

includes:
  foundation:
    taskfile: ./tasks/foundation.yml
    flatten: true

tasks:
  default:
    cmds:
      - task --list

  bootstrap:
    desc: Install repository dependencies and pinned tools
    cmds:
      - go work sync
      - go mod download
      - go -C tools mod download
      - go -C tools install tool
      - pnpm install
      - go tool buf lint

  doctor:
    desc: Verify development tools and infrastructure
    cmds:
      - bash scripts/doctor.sh

  tools:install:
    desc: Install all Go tools pinned by the tools module
    cmds:
      - go -C tools install tool

  contracts:lint:
    desc: Lint all Protobuf contracts
    cmds:
      - go tool buf lint

  contracts:generate:
    desc: Generate Go code from Protobuf contracts
    cmds:
      - rm -rf gen/go
      - mkdir -p gen/go
      - go tool buf generate
      - go mod tidy

  contracts:check-generated:
    desc: Verify committed generated contracts are current
    cmds:
      - task: contracts:generate
      - git diff --exit-code -- gen/go go.mod go.sum

  contracts:breaking:
    desc: Check Protobuf contracts for breaking changes against main
    cmds:
      - go tool buf breaking --against .git#branch=main

  workflow:check:
    desc: Run Temporal static workflow analysis
    cmds:
      - >-
        go run go.temporal.io/sdk/contrib/tools/workflowcheck
        ./services/execution-orchestrator/...

  infra:up:
    desc: Start local infrastructure
    cmds:
      - >-
        {{.COMPOSE}} up -d
        postgres redis kafka kafka-init temporal minio minio-init

  infra:observability:
    desc: Start optional local observability
    cmds:
      - "{{.COMPOSE}} --profile observability up -d otel-lgtm"

  infra:ps:
    desc: Show infrastructure status
    cmds:
      - "{{.COMPOSE}} ps -a"

  infra:logs:
    desc: Follow infrastructure logs
    cmds:
      - "{{.COMPOSE}} logs -f --tail=200"

  infra:down:
    desc: Stop local infrastructure
    cmds:
      - "{{.COMPOSE}} down --remove-orphans"

  infra:reset:
    desc: Permanently delete local infrastructure volumes
    prompt: This permanently deletes all local development data. Continue?
    cmds:
      - "{{.COMPOSE}} down -v --remove-orphans"

  db:tenant:hash:
    desc: Recompute the tenant migration integrity checksum
    cmds:
      - atlas migrate hash --env tenant

  db:tenant:status:
    desc: Show tenant database migration status
    cmds:
      - atlas migrate status --env tenant

  db:tenant:validate:
    desc: Validate tenant migration integrity
    cmds:
      - atlas migrate validate --env tenant

  db:tenant:apply:
    desc: Apply pending tenant database migrations
    preconditions:
      - sh: test -n "${TENANT_MIGRATION_DATABASE_URL:-}"
        msg: TENANT_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env tenant

  db:tenant:dry-run:
    desc: Print pending tenant migrations without applying them
    preconditions:
      - sh: test -n "${TENANT_MIGRATION_DATABASE_URL:-}"
        msg: TENANT_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env tenant --dry-run

  db:organization:hash:
    desc: Recompute organization migration integrity checksum
    cmds:
      - atlas migrate hash --env organization

  db:organization:status:
    desc: Show organization database migration status
    cmds:
      - atlas migrate status --env organization

  db:organization:validate:
    desc: Validate organization migration integrity
    cmds:
      - atlas migrate validate --env organization

  db:organization:apply:
    desc: Apply pending organization database migrations
    preconditions:
      - sh: test -n "${ORGANIZATION_MIGRATION_DATABASE_URL:-}"
        msg: ORGANIZATION_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env organization

  db:organization:dry-run:
    desc: Print pending organization migrations without applying them
    preconditions:
      - sh: test -n "${ORGANIZATION_MIGRATION_DATABASE_URL:-}"
        msg: ORGANIZATION_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env organization --dry-run

  db:work:hash:
    desc: Recompute the work migration integrity checksum
    cmds:
      - atlas migrate hash --env work

  db:work:status:
    desc: Show work database migration status
    cmds:
      - atlas migrate status --env work

  db:work:validate:
    desc: Validate work migration integrity
    cmds:
      - atlas migrate validate --env work

  db:work:apply:
    desc: Apply pending work database migrations
    preconditions:
      - sh: test -n "${WORK_MIGRATION_DATABASE_URL:-}"
        msg: WORK_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env work

  db:work:dry-run:
    desc: Print pending work migrations without applying them
    preconditions:
      - sh: test -n "${WORK_MIGRATION_DATABASE_URL:-}"
        msg: WORK_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env work --dry-run

  db:policy:hash:
    desc: Recompute the policy migration integrity checksum
    cmds:
      - atlas migrate hash --env policy

  db:policy:status:
    desc: Show policy database migration status
    cmds:
      - atlas migrate status --env policy

  db:policy:validate:
    desc: Validate policy migration integrity
    cmds:
      - atlas migrate validate --env policy

  db:policy:apply:
    desc: Apply pending policy database migrations
    preconditions:
      - sh: test -n "${POLICY_MIGRATION_DATABASE_URL:-}"
        msg: POLICY_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env policy

  db:policy:dry-run:
    desc: Print pending policy migrations without applying them
    preconditions:
      - sh: test -n "${POLICY_MIGRATION_DATABASE_URL:-}"
        msg: POLICY_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env policy --dry-run

  test:work:
    desc: Run Work Management Service tests
    cmds:
      - go test -race -count=1 ./services/work-management/...
      - go test -race -count=1 ./services/api-bff/internal/http/work/...

  test:organization:
    desc: Run Company and Agent Service tests
    cmds:
      - go test -race -count=1 ./services/organization-agent/...
      - go test -race -count=1 ./services/api-bff/internal/http/organization/...
      - go test -race -count=1 ./services/execution-orchestrator/...

  test:policy:
    desc: Run Policy Service tests
    cmds:
      - go test -race -count=1 ./services/policy-approval/...
      - go test -race -count=1 ./services/api-bff/internal/http/policy/...
      - go test -race -count=1 ./services/execution-orchestrator/...

  db:projection:hash:
    desc: Recompute Projection Service migration checksums
    cmds:
      - atlas migrate hash --env projection

  db:projection:validate:
    desc: Validate Projection Service migrations
    cmds:
      - atlas migrate validate --env projection

  db:projection:lint:
    desc: Lint Projection Service migration
    cmds:
      - |
        if atlas migrate lint --env projection --latest 1; then
          :
        elif atlas migrate lint --env projection --latest 1 2>&1 | grep -q "available only to Atlas Pro"; then
          echo "atlas migrate lint skipped: requires Atlas Pro"
        else
          exit 1
        fi

  db:projection:status:
    desc: Show Projection Service migration status
    cmds:
      - atlas migrate status --env projection

  db:projection:dry-run:
    desc: Show pending Projection Service migrations
    preconditions:
      - sh: test -n "${PROJECTION_MIGRATION_DATABASE_URL:-}"
        msg: PROJECTION_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env projection --dry-run

  db:projection:apply:
    desc: Apply Projection Service migrations
    preconditions:
      - sh: test -n "${PROJECTION_MIGRATION_DATABASE_URL:-}"
        msg: PROJECTION_MIGRATION_DATABASE_URL is required
    cmds:
      - atlas migrate apply --env projection

  test:projection:
    desc: Run Projection Service tests
    cmds:
      - go test -race -count=1 ./services/projection/...
      - go test -race -count=1 ./services/api-bff/internal/http/projection/...

  dev:web:
    desc: Run the React development server
    cmds:
      - pnpm --filter @gereh/web dev

  dev:api:
    desc: Run the API BFF with live reload
    cmds:
      - bash scripts/dev-service.sh api-bff

  dev:service:
    desc: "Run a Go service. Example: task dev:service SERVICE=tenant"
    requires:
      vars:
        - SERVICE
    cmds:
      - bash scripts/dev-service.sh {{.SERVICE}}

  format:
    desc: Format Go, Protobuf and frontend source
    cmds:
      - go fmt ./...
      - go tool buf format -w
      - pnpm -r --if-present format

  format:check:
    desc: Verify source formatting
    cmds:
      - |
        files="$(find platform services runtime-connectors gen -type f -name '*.go' 2>/dev/null)"
        if [[ -n "${files}" ]]; then
          unformatted="$(gofmt -l ${files})"
          if [[ -n "${unformatted}" ]]; then
            echo "${unformatted}"
            exit 1
          fi
        fi
      - go tool buf format --diff --exit-code
      - pnpm -r --if-present format:check

  lint:
    desc: Run static analysis
    cmds:
      - go vet ./...
      - go tool golangci-lint run
      - go tool buf lint
      - task: workflow:check
      - pnpm -r --if-present lint

  test:
    desc: Run backend and frontend tests
    cmds:
      - go test -race -count=1 ./...
      - pnpm -r --if-present test

  test:onboarding:
    desc: Run tenant onboarding integration tests
    preconditions:
      - sh: test -n "${TENANT_TEST_DATABASE_URL:-}"
        msg: TENANT_TEST_DATABASE_URL is required
    cmds:
      - go test -count=1 ./services/tenant/...
      - go test -count=1 ./services/execution-orchestrator/...

  build:
    desc: Build all services and frontend applications
    cmds:
      - bash scripts/build-services.sh
      - pnpm -r --if-present build

  check:
    desc: Run all validation required before committing
    cmds:
      - task: format:check
      - task: lint
      - task: db:tenant:validate
      - task: db:organization:validate
      - task: db:work:validate
      - task: db:policy:validate
      - task: db:projection:validate
      - task: db:projection:lint
      - task: workflow:check
      - task: test:organization
      - task: test:work
      - task: test:policy
      - task: test:projection
      - task: test
      - task: build
      - task: contracts:check-generated
      - task: contracts:breaking
