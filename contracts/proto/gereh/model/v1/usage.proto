syntax = "proto3";

package gereh.model.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aminio9/gereh/gen/go/gereh/model/v1;modelv1";

enum ModelUsageOutcome {
  MODEL_USAGE_OUTCOME_UNSPECIFIED = 0;
  MODEL_USAGE_OUTCOME_SUCCESS = 1;
  MODEL_USAGE_OUTCOME_CLIENT_DISCONNECTED = 2;
  MODEL_USAGE_OUTCOME_PROVIDER_ERROR = 3;
  MODEL_USAGE_OUTCOME_RATE_LIMITED = 4;
}

message ModelUsageRecorded {
  string tenant_id = 1;
  string request_id = 2;
  string correlation_id = 3;

  string agent_id = 4;
  string execution_id = 5;
  string workflow_id = 6;
  string run_id = 7;
  string step_id = 8;

  string connection_id = 9;
  string offering_id = 10;
  string provider_key = 11;
  string provider_model_id = 12;

  int64 prompt_tokens = 13;
  int64 completion_tokens = 14;
  int64 total_tokens = 15;

  int64 cached_prompt_tokens = 16;
  int64 reasoning_tokens = 17;

  int64 estimated_cost_microusd = 18;

  ModelUsageOutcome outcome = 19;
  string error_code = 20;

  int64 duration_ms = 21;
  int64 time_to_first_token_ms = 22;

  bool streamed = 23;
  int32 retry_count = 24;
  string fallback_from_offering_id = 25;

  google.protobuf.Timestamp recorded_at = 26;
}
