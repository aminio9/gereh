syntax = "proto3";

package gereh.organization.v1;

import "gereh/organization/v1/organization.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aminio9/gereh/gen/go/gereh/organization/v1;organizationv1";

message CompanyCreated {
  Company company = 1;
}

message CompanyUpdated {
  Company company = 1;
  string updated_by_user_id = 2;
}

message CompanyArchived {
  Company company = 1;
  string archived_by_user_id = 2;
}

message AgentCreated {
  Agent agent = 1;
}

message AgentUpdated {
  Agent agent = 1;
  string updated_by_user_id = 2;
}

message AgentManagerChanged {
  Agent agent = 1;
  optional string previous_manager_agent_id = 2;
  string changed_by_user_id = 3;
}

message AgentLifecycleChanged {
  Agent agent = 1;
  AgentStatus previous_status = 2;
  string changed_by_user_id = 3;
}

message AgentDeleted {
  Agent agent = 1;
  string deleted_by_user_id = 2;
  google.protobuf.Timestamp deleted_at = 3;
}
