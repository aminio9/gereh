syntax = "proto3";

package gereh.runtime.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/aminio9/gereh/gen/go/gereh/runtime/v1;runtimev1";

service RuntimeManagerService {
  // EnsureTenantRuntime is idempotent by operation_id.
  //
  // Repeated requests for the same operation must converge on the same
  // desired RuntimeCell rather than creating duplicate infrastructure.
  rpc EnsureTenantRuntime(EnsureTenantRuntimeRequest) returns (EnsureTenantRuntimeResponse);
}

enum RuntimeProvisioningState {
  RUNTIME_PROVISIONING_STATE_UNSPECIFIED = 0;
  RUNTIME_PROVISIONING_STATE_PENDING = 1;
  RUNTIME_PROVISIONING_STATE_READY = 2;
  RUNTIME_PROVISIONING_STATE_FAILED = 3;
}

// RuntimeKind identifies the runtime implementation hosted by a RuntimeCell.
// It intentionally contains product/runtime identity only and no cloud
// provider information.
enum RuntimeKind {
  RUNTIME_KIND_UNSPECIFIED = 0;
  RUNTIME_KIND_OPENCLAW = 1;
  RUNTIME_KIND_HERMES = 2;
}

message EnsureTenantRuntimeRequest {
  string tenant_id = 1;
  string operation_id = 2;
  string region = 3;
  string isolation_tier = 4;
  RuntimeKind runtime = 5;

  // Runtime implementation release desired for the cell.
  // This is a logical runtime release, not a container image supplied by
  // untrusted callers. The Runtime Manager resolves releases to approved,
  // digest-pinned images.
  string runtime_version = 6;

  // Kubernetes StorageClass selected by trusted regional placement policy.
  // Provider-specific CSI implementation details remain outside this API.
  string storage_class = 7;
}

message EnsureTenantRuntimeResponse {
  RuntimeProvisioningState state = 1;
  string runtime_cell_id = 2;
  google.protobuf.Duration retry_after = 3;

  // Safe machine-readable failure code. Never place secrets here.
  string error_code = 4;
}
