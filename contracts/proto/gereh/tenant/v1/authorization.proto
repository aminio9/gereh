syntax = "proto3";

package gereh.tenant.v1;

option go_package = "github.com/aminio9/gereh/gen/go/gereh/tenant/v1;tenantv1";

// Permission identifies one tenant-scoped capability.
//
// New values may be added compatibly. Existing numeric values must never be
// reused or renumbered.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;

  PERMISSION_TENANT_READ = 1;
  PERMISSION_TENANT_UPDATE = 2;
  PERMISSION_TENANT_ARCHIVE = 3;

  PERMISSION_MEMBER_LIST = 10;
  PERMISSION_MEMBER_ADD = 11;
  PERMISSION_MEMBER_UPDATE_ROLE = 12;
  PERMISSION_MEMBER_REMOVE = 13;

  PERMISSION_ENTITLEMENT_READ = 20;

  PERMISSION_COMPANY_READ = 30;
  PERMISSION_COMPANY_CREATE = 31;
  PERMISSION_COMPANY_UPDATE = 32;
  PERMISSION_COMPANY_ARCHIVE = 33;

  PERMISSION_AGENT_READ = 40;
  PERMISSION_AGENT_CREATE = 41;
  PERMISSION_AGENT_UPDATE = 42;
  PERMISSION_AGENT_DELETE = 43;
  PERMISSION_AGENT_HIERARCHY_MANAGE = 44;
  PERMISSION_AGENT_LIFECYCLE_MANAGE = 45;

  PERMISSION_WORK_READ = 50;

  PERMISSION_GOAL_CREATE = 51;
  PERMISSION_GOAL_UPDATE = 52;

  PERMISSION_PROJECT_CREATE = 53;
  PERMISSION_PROJECT_UPDATE = 54;

  PERMISSION_TASK_CREATE = 55;
  PERMISSION_TASK_UPDATE = 56;
  PERMISSION_TASK_STATUS_UPDATE = 57;
  PERMISSION_TASK_ASSIGN = 58;
  PERMISSION_TASK_DEPENDENCY_MANAGE = 59;

  PERMISSION_TASK_COMMENT_CREATE = 60;
  PERMISSION_TASK_COMMENT_MODERATE = 61;
  PERMISSION_TASK_ARTIFACT_MANAGE = 62;
  PERMISSION_TASK_CHECKLIST_MANAGE = 63;
  PERMISSION_TASK_SCHEDULE_MANAGE = 64;

  PERMISSION_POLICY_READ = 70;
  PERMISSION_POLICY_CREATE = 71;
  PERMISSION_POLICY_UPDATE = 72;
  PERMISSION_POLICY_ACTIVATE = 73;
  PERMISSION_POLICY_ARCHIVE = 74;
  PERMISSION_POLICY_DECISION_READ = 75;

  PERMISSION_MODEL_PROVIDER_READ = 80;
  PERMISSION_MODEL_CONNECTION_READ = 81;
  PERMISSION_MODEL_CONNECTION_CREATE = 82;
  PERMISSION_MODEL_CONNECTION_UPDATE = 83;
  PERMISSION_MODEL_CONNECTION_ARCHIVE = 84;

  PERMISSION_MODEL_CATALOG_READ = 85;
  PERMISSION_MODEL_CATALOG_REFRESH = 86;

  PERMISSION_MODEL_BINDING_READ = 87;
  PERMISSION_MODEL_BINDING_UPDATE = 88;
  PERMISSION_MODEL_BINDING_REMOVE = 89;
}

// TenantRole is a tenant-scoped membership role that grants permissions.
enum TenantRole {
  TENANT_ROLE_UNSPECIFIED = 0;
  TENANT_ROLE_OWNER = 1;
  TENANT_ROLE_ADMIN = 2;
  TENANT_ROLE_MEMBER = 3;
  TENANT_ROLE_VIEWER = 4;
}

// AuthorizationDenialReason provides a stable machine-readable reason without
// exposing internal database or implementation details.
enum AuthorizationDenialReason {
  AUTHORIZATION_DENIAL_REASON_UNSPECIFIED = 0;
  AUTHORIZATION_DENIAL_REASON_NONE = 1;
  AUTHORIZATION_DENIAL_REASON_NOT_A_MEMBER = 2;
  AUTHORIZATION_DENIAL_REASON_TENANT_ARCHIVED = 3;
  AUTHORIZATION_DENIAL_REASON_PERMISSION_NOT_GRANTED = 4;
  AUTHORIZATION_DENIAL_REASON_TENANT_NOT_ACTIVE = 5;
}

// AuthorizationDecision is a tenant-scoped authorization result.
message AuthorizationDecision {
  bool allowed = 1;
  string tenant_id = 2;
  string actor_user_id = 3;
  Permission permission = 4;
  TenantRole role = 5;
  int64 tenant_version = 6;
  int64 membership_version = 7;
  AuthorizationDenialReason denial_reason = 8;
}

message CheckAuthorizationRequest {
  string actor_user_id = 1;
  string tenant_id = 2;
  Permission permission = 3;
}

message CheckAuthorizationResponse {
  AuthorizationDecision decision = 1;
}

message BatchCheckAuthorizationRequest {
  string actor_user_id = 1;
  string tenant_id = 2;

  // Limited by the server to 64 permissions per request.
  repeated Permission permissions = 3;
}

message BatchCheckAuthorizationResponse {
  repeated AuthorizationDecision decisions = 1;
}
