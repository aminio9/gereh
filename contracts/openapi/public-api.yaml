openapi: 3.1.0
info:
  title: Gereh Public API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: string
