openapi: 3.1.0

info:
  title: Gereh Public API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Public REST API exposed by the Gereh API BFF.

servers:
  - url: /

security:
  - SessionCookie: []

tags:
  - name: System
    description: Platform status and metadata
  - name: Tenant
    description: Tenant provisioning and membership operations
  - name: Work
    description: Goal, project, and task management operations
  - name: Projection
    description: Eventually consistent tenant read models

paths:
  /v1/status:
    get:
      operationId: getSystemStatus
      summary: Get API status
      description: Returns API BFF health and version information.
      tags:
        - System
      security: []
      responses:
        "200":
          description: The API is available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "404":
          description: The status endpoint is not mounted.
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/onboarding:
    post:
      operationId: createTenant
      summary: Start tenant provisioning
      description: |
        Creates a new tenant and starts asynchronous provisioning. The caller
        is the initial owner. Provisioning progress can be polled through the
        operation resource referenced by the Location header.
      tags:
        - Tenant
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: |
            Deduplicates concurrent or retried requests. A repeated key with
            the same payload returns the same operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "202":
          description: Provisioning accepted.
          headers:
            Location:
              description: Poll target for the onboarding operation.
              schema:
                type: string
                pattern: "^/v1/operations/"
            Retry-After:
              description: Suggested poll interval in seconds.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Tenant Service returned an invalid upstream response.

  /v1/operations/{operationId}:
    get:
      operationId: getOperation
      summary: Get onboarding operation status
      description: |
        Returns the current state of an asynchronous operation. Only the
        actor who started the operation can read it.
      tags:
        - Tenant
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Operation identifier returned by createTenant.
      responses:
        "200":
          description: Operation state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

