              schema:
                $ref: "#/components/schemas/RemoveAgentModelBindingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: gereh_session
      description: |
        Browser session issued by the Identity Service. All authenticated
        endpoints require this HttpOnly cookie; mutations additionally
        require the gereh_csrf cookie sent as the X-CSRF-Token header.
  parameters:
    Pagination:
      name: pageToken
      in: query
      required: false
      description: Opaque keyset cursor returned by a previous page.
      schema:
        type: string
  headers:
    RequestId:
      description: Identifier used to correlate logs and traces.
      schema:
        type: string
        minLength: 1

  schemas:
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - displayName
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$"
          description: Unique, URL-safe tenant identifier.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        region:
          type: string
          minLength: 1
          description: Provisioning region; defaults to the platform default.
        retentionDays:
          type: integer
          minimum: 1
          description: Audit retention window in days.

    CreateTenantResponse:
      type: object
      additionalProperties: false
      required:
        - context
        - operation
      properties:
        context:
          $ref: "#/components/schemas/TenantContext"
        operation:
          $ref: "#/components/schemas/Operation"

    TenantContext:
      type: object
      additionalProperties: false
      required:
        - tenant
      properties:
        tenant:
          type: object
          additionalProperties: false
          required:
            - id
            - slug
            - displayName
            - status
            - region
            - version
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            displayName:
              type: string
            status:
              type: string
              enum:
                - provisioning
                - active
                - provisioning_failed
                - archived
            region:
              type: string
            retentionDays:
              type: integer
            version:
              type: integer
              format: int64

    Operation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - state
      properties:
        operationId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - canceled
        resourceName:
          type: string
          description: Canonical resource name managed by the operation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/OperationError"
        metadata:
          type: object
          additionalProperties:
            type: string
        tenantId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        requestId:
          type: string
        workflowId:
          type: string
        workflowRunId:
          type: string
        version:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time

    OperationError:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object

    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
          examples:
            - api-bff
        version:
          type: string
          minLength: 1
          examples:
            - dev

