name: gereh-platform-dev

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        PYPI_INDEX: https://mirrors.ustc.edu.cn/pypi/simple
        GOPROXY_URL: https://goproxy.cn,direct
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspaces/gereh-platform:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - pnpm-store:/home/vscode/.local/share/pnpm/store
    environment:
      GEREH_ENV: development
      GOPROXY: https://goproxy.cn,direct
      GO111MODULE: "on"
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
      npm_config_registry: https://registry.npmmirror.com
      PIP_INDEX_URL: https://mirrors.ustc.edu.cn/pypi/simple
      UV_DEFAULT_INDEX: https://mirrors.ustc.edu.cn/pypi/simple
      DATABASE_URL: postgres://gereh:gereh@postgres:5432/gereh?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      S3_ENDPOINT: http://minio:9000
      S3_REGION: local
      S3_ACCESS_KEY_ID: gereh
      S3_SECRET_ACCESS_KEY: gereh-local-secret
      S3_FORCE_PATH_STYLE: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gereh-dev

  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gereh
      POSTGRES_PASSWORD: gereh
      POSTGRES_DB: gereh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gereh -d gereh"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gereh-dev

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gereh-dev

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - gereh-dev

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        topics=(
          gereh.tenant.events.v1
          gereh.company.events.v1
          gereh.agent.events.v1
          gereh.work.events.v1
          gereh.execution.commands.v1
          gereh.execution.events.v1
          gereh.approval.events.v1
          gereh.model.events.v1
          gereh.model.usage.v1
          gereh.tool.events.v1
          gereh.billing.events.v1
          gereh.audit.events.v1
          gereh.notification.commands.v1
        )
        for topic in "$${topics[@]}"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions 3 \
            --replication-factor 1
        done
    restart: "no"
    networks:
      - gereh-dev

  temporal:
    image: temporalio/temporal:1.8.1
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-port
      - "8233"
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "localhost:7233"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - gereh-dev

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gereh
      MINIO_ROOT_PASSWORD: gereh-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live >/dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - gereh-dev

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 gereh gereh-local-secret
        mc mb --ignore-existing local/gereh-artifacts
        mc mb --ignore-existing local/gereh-workspaces
        mc mb --ignore-existing local/gereh-exports
    restart: "no"
    networks:
      - gereh-dev

  otel-lgtm:
    image: grafana/otel-lgtm:0.29.2
    profiles: ["observability"]
    restart: unless-stopped

    ports:
      - "127.0.0.1:13001:3000"

    expose:
      - "4317"
      - "4318"

    volumes:
      - otel-lgtm-data:/data

    networks:
      - gereh-dev

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  otel-lgtm-data:
  go-mod-cache:
  go-build-cache:
  pnpm-store:

networks:
  gereh-dev:
    driver: bridge
