---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runtimecells.runtime.gereh.ai
spec:
  group: runtime.gereh.ai
  names:
    categories:
    - gereh
    kind: RuntimeCell
    listKind: RuntimeCellList
    plural: runtimecells
    shortNames:
    - rcell
    singular: runtimecell
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.tenantId
      name: Tenant
      priority: 1
      type: string
    - jsonPath: .spec.region
      name: Region
      priority: 1
      type: string
    - jsonPath: .spec.isolationTier
      name: Tier
      priority: 1
      type: string
    - jsonPath: .spec.version
      name: Version
      priority: 1
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          RuntimeCell represents desired and observed state for one tenant runtime.

          RuntimeCell objects are stored in the trusted runtime-system namespace.
          Tenant workloads themselves must not receive write permission to this API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RuntimeCellSpec contains durable desired state.

              Infrastructure-specific implementation details such as VM size, cloud
              provider, node selectors, image pull credentials, Secrets, or provider API
              keys must never be added here.
            properties:
              isolationTier:
                description: |-
                  IsolationTier selects the tenant isolation topology.

                  A tier change creates a different security topology and therefore
                  requires a new RuntimeCell instead of mutating an existing cell.
                enum:
                - standard
                - dedicated
                type: string
                x-kubernetes-validations:
                - message: isolationTier is immutable
                  rule: self == oldSelf
              operationId:
                description: |-
                  OperationID is the control-plane idempotency identity.

                  Repeated EnsureTenantRuntime calls using the same operation ID must
                  converge on the same RuntimeCell.
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                type: string
                x-kubernetes-validations:
                - message: operationId is immutable
                  rule: self == oldSelf
              region:
                description: |-
                  Region is the Gereh logical execution region.

                  Examples may include ir-thr-1 or another Gereh-defined placement region.
                  This is not a cloud-provider resource ID.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              runtime:
                description: Runtime identifies which agent runtime this cell hosts.
                enum:
                - openclaw
                - hermes
                type: string
                x-kubernetes-validations:
                - message: runtime is immutable
                  rule: self == oldSelf
              storageClass:
                description: |-
                  StorageClass is the Kubernetes StorageClass selected by trusted regional
                  placement policy.

                  It is a Kubernetes abstraction, not an Arvan/RKE2/AWS-specific volume
                  implementation.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - message: storageClass is immutable
                  rule: self == oldSelf
              tenantId:
                description: |-
                  TenantID identifies the Gereh tenant that owns this runtime cell.

                  It is opaque to Kubernetes. Runtime Manager is responsible for verifying
                  that the authenticated control-plane request is authorized for it.
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                type: string
                x-kubernetes-validations:
                - message: tenantId is immutable
                  rule: self == oldSelf
              version:
                description: |-
                  RuntimeVersion is the approved logical runtime release.

                  Runtime Manager maps this value to a digest-pinned image. It is mutable
                  because runtime upgrades reconcile the existing cell to a newer approved
                  version.
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                type: string
            required:
            - isolationTier
            - operationId
            - region
            - runtime
            - storageClass
            - tenantId
            - version
            type: object
          status:
            description: RuntimeCellStatus contains controller-owned observed state.
            properties:
              conditions:
                description: Conditions expose detailed Kubernetes-style readiness
                  information.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureCode:
                description: |-
                  FailureCode is a safe machine-readable failure identifier.

                  It must never contain credentials, provider responses, prompts, tool
                  output, URLs with secrets, or arbitrary stack traces.
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation last successfully observed
                  by Runtime Manager.
                format: int64
                minimum: 0
                type: integer
              observedRuntimeVersion:
                description: ObservedRuntimeVersion is the runtime release currently
                  running.
                maxLength: 128
                type: string
              phase:
                description: Phase is a concise human-readable state summary.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Failed
                - Deleting
                type: string
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.tenantId
    - jsonPath: .spec.operationId
    - jsonPath: .spec.runtime
    - jsonPath: .status.phase
    served: true
    storage: true
    subresources:
      status: {}
