---
- name: Verify Gereh execution Kubernetes cluster
  hosts: rke2_servers[0]
  become: true
  gather_facts: false
  vars:
    kubectl: >-
      /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml

  tasks:
    - name: Verify Kubernetes readiness
      ansible.builtin.command:
        cmd: "{{ kubectl }} get --raw=/readyz"
      changed_when: false

    - name: Get nodes
      ansible.builtin.command:
        cmd: "{{ kubectl }} get nodes -o wide"
      register: nodes
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines

    - name: Verify system worker exists
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} get nodes -l gereh.ai/node-pool=system -o name
      register: system_nodes
      changed_when: false
      failed_when: system_nodes.stdout | length == 0

    - name: Verify runtime worker exists
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} get nodes -l gereh.ai/node-pool=runtime -o name
      register: runtime_nodes
      changed_when: false
      failed_when: runtime_nodes.stdout | length == 0

    - name: Verify sandbox worker exists
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} get nodes -l gereh.ai/node-pool=sandbox -o name
      register: sandbox_nodes
      changed_when: false
      failed_when: sandbox_nodes.stdout | length == 0

    - name: Verify runtime namespace
      ansible.builtin.command:
        cmd: "{{ kubectl }} get namespace gereh-runtime-cells"
      changed_when: false

    - name: Verify sandbox namespace
      ansible.builtin.command:
        cmd: "{{ kubectl }} get namespace gereh-sandboxes"
      changed_when: false

    - name: Verify runtime default deny policy
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} -n gereh-runtime-cells get networkpolicy default-deny
      changed_when: false

    - name: Verify sandbox default deny policy
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} -n gereh-sandboxes get networkpolicy default-deny
      changed_when: false

    - name: Verify execution pods
      ansible.builtin.command:
        cmd: "{{ kubectl }} get pods -A -o wide"
      register: pods
      changed_when: false

    - name: Print pod status
      ansible.builtin.debug:
        var: pods.stdout_lines
